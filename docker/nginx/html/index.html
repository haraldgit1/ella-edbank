<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ella-DemoBank</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242736;
    --border: #2e3248;
    --accent: #5b8af0;
    --accent-dim: #3d5fa8;
    --text: #e2e4ef;
    --text-dim: #8a8fa8;
    --ok: #4ade80;
    --warn: #facc15;
    --err: #f87171;
    --user-bubble: #2a3356;
    --bot-bubble: #1e2235;
    --radius: 10px;
    --font-mono: 'Courier New', monospace;
  }

  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }

  /* Layout */
  .app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; padding: 0 12px; }

  /* Header */
  header { padding: 14px 0 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header h1 { font-size: 1.2rem; font-weight: 600; color: var(--text); }
  .beta-badge { font-size: 0.65rem; background: var(--accent-dim); color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 600; }

  /* Status bar */
  .status-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .status-item { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; color: var(--text-dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.err { background: var(--err); }

  /* Chat area */
  .chat-area { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 14px; }
  .chat-area::-webkit-scrollbar { width: 5px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Messages */
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
  .avatar.bot { background: var(--accent-dim); color: #fff; }
  .avatar.user { background: var(--user-bubble); color: var(--text-dim); }
  .bubble { max-width: 82%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.55; }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 3px; }
  .msg.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 3px; }

  /* Markdown-ish rendering */
  .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.88rem; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  .bubble th { background: var(--surface2); font-weight: 600; }
  .bubble code { background: var(--surface2); padding: 1px 5px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.85em; }
  .bubble pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow-x: auto; margin: 8px 0; }
  .bubble pre code { background: none; padding: 0; }
  .bubble p { margin: 6px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { color: #c5ccf5; }
  .bubble ul, .bubble ol { padding-left: 18px; margin: 6px 0; }

  /* Sources */
  .sources { font-size: 0.78rem; color: var(--text-dim); margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
  .sources span { color: var(--accent); }

  /* Tool trace */
  .tool-trace { font-size: 0.75rem; color: var(--text-dim); margin-top: 6px; }
  .tool-trace summary { cursor: pointer; color: var(--accent); }
  .tool-trace pre { background: var(--surface2); border-radius: 5px; padding: 6px; margin-top: 4px; overflow-x: auto; }

  /* Typing indicator */
  .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

  /* Input area */
  .input-area { border-top: 1px solid var(--border); padding: 12px 0 16px; flex-shrink: 0; }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 10px 12px; font-size: 0.95rem; font-family: inherit; resize: none; outline: none; min-height: 44px; max-height: 140px; line-height: 1.4; transition: border-color 0.15s; }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-dim); }
  button.send-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 10px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer; flex-shrink: 0; height: 44px; transition: background 0.15s; }
  button.send-btn:hover { background: var(--accent-dim); }
  button.send-btn:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; }

  /* Import area */
  .import-area { margin-top: 10px; }
  .import-tabs { display: flex; gap: 0; margin-bottom: 6px; }
  .import-tab { font-size: 0.78rem; color: var(--text-dim); background: none; border: 1px solid var(--border); padding: 3px 10px; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .import-tab:first-child { border-radius: 5px 0 0 5px; }
  .import-tab:last-child { border-radius: 0 5px 5px 0; border-left: none; }
  .import-tab.active { background: var(--surface2); color: var(--text); }
  .import-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .import-area label { font-size: 0.82rem; color: var(--text-dim); white-space: nowrap; }
  input[type=file] { font-size: 0.8rem; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  input.url-input { flex: 1; min-width: 200px; font-size: 0.82rem; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; outline: none; }
  input.url-input:focus { border-color: var(--accent); }
  input.url-input::placeholder { color: var(--text-dim); }
  button.import-btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-size: 0.82rem; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
  button.import-btn:hover { background: var(--border); }
  button.import-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .import-status { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; }
  .import-status.ok { color: var(--ok); }
  .import-status.err { color: var(--err); }

  /* Clear button */
  .clear-btn { background: none; border: none; color: var(--text-dim); font-size: 0.78rem; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .clear-btn:hover { background: var(--surface2); color: var(--text); }

  /* Context bar */
  .context-bar { display: flex; flex-direction: column; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; font-size: 0.76rem; color: var(--text-dim); }
  .ctx-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctx-label { white-space: nowrap; color: var(--text-dim); }
  .ctx-meter { flex: 0 0 80px; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .ctx-meter-fill { height: 100%; border-radius: 3px; background: var(--ok); transition: width 0.4s, background 0.4s; }
  .ctx-meter-fill.warn { background: var(--warn); }
  .ctx-meter-fill.crit { background: var(--err); }
  .ctx-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .ctx-tag { border-radius: 4px; padding: 1px 7px; font-size: 0.72rem; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  .ctx-tag.available { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); }
  .ctx-tag.used { background: #1e3a2a; border: 1px solid #2d5c3f; color: #4ade80; }
  .ctx-tag.used-mcp { background: #1e2a3a; border: 1px solid #2d3f5c; color: #60a5fa; }
  .ctx-tag[title] { cursor: help; }
  .ctx-no-sources { font-size: 0.74rem; color: var(--text-dim); font-style: italic; }

  .empty-hint { color: var(--text-dim); font-size: 0.9rem; text-align: center; margin: auto; padding: 40px 20px; line-height: 1.8; }
  .empty-hint strong { color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Ella-DemoBank <span class="beta-badge">PoC</span></h1>
    </div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
      <button class="clear-btn" onclick="clearConversation()">Verlauf löschen</button>
    </div>
  </header>

  <div class="status-bar" id="status-bar">
    <div class="status-item"><div class="dot" id="dot-app"></div><span id="label-app">App …</span></div>
    <div class="status-item"><div class="dot" id="dot-llm"></div><span id="label-llm">LLM …</span></div>
    <div class="status-item"><div class="dot" id="dot-rag"></div><span id="label-rag">RAG …</span></div>
    <div class="status-item"><div class="dot" id="dot-mcp"></div><span id="label-mcp">MCP …</span></div>
    <div class="status-item"><div class="dot" id="dot-pg"></div><span id="label-pg">PostgreSQL …</span></div>
    <div class="status-item" style="margin-left:auto; font-size:0.75rem; color:var(--text-dim);">lokal</div>
  </div>

  <div class="context-bar" id="context-bar">
    <div class="ctx-row">
      <span class="ctx-label">Gespräch:</span>
      <span class="ctx-label" id="ctx-turns">neu</span>
      <div class="ctx-meter" title="Kontext-Auslastung des Sprachmodells">
        <div class="ctx-meter-fill" id="ctx-fill" style="width:0%"></div>
      </div>
      <span class="ctx-label" id="ctx-pct" style="min-width:32px"></span>
      <span style="color:var(--border); margin: 0 2px;">|</span>
      <span class="ctx-label">Letzte Antwort:</span>
      <div class="ctx-tags" id="ctx-used"><span class="ctx-no-sources">—</span></div>
    </div>
    <div class="ctx-row">
      <span class="ctx-label">RAG-Datenbank:</span>
      <div class="ctx-tags" id="ctx-sources"><span class="ctx-no-sources">keine Dokumente</span></div>
    </div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="empty-hint" id="empty-hint">
      <strong>Ella-DemoBank</strong><br>
      Frag mich nach Oracle-Fehlern oder Bankverbindungen.<br><br>
      Beispiele:<br>
      „Was bedeutet ORA-01555?"<br>
      „Welchen IBAN hat Herr Hannes Meier?"
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="msg-input" placeholder="Nachricht eingeben … (Enter = senden, Shift+Enter = Zeilenumbruch)" rows="1" maxlength="4000"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">Senden</button>
    </div>
    <div class="import-area">
      <div class="import-tabs">
        <button class="import-tab active" id="tab-file" onclick="switchImportTab('file')">Datei importieren</button>
        <button class="import-tab" id="tab-url" onclick="switchImportTab('url')">URL importieren</button>
      </div>
      <div class="import-row" id="import-file-row">
        <label for="doc-file">Dokument (.csv, .txt, .md, .html, .rtf, .pdf):</label>
        <input type="file" id="doc-file" accept=".csv,.txt,.md,.html,.htm,.rtf,.pdf">
        <button class="import-btn" id="import-btn" onclick="importDocument()">Importieren</button>
      </div>
      <div class="import-row" id="import-url-row" style="display:none;">
        <label for="doc-url">URL (HTML-Seite):</label>
        <input type="text" id="doc-url" class="url-input" placeholder="https://beispiel.de/seite">
        <button class="import-btn" id="import-url-btn" onclick="importUrl()">Importieren</button>
      </div>
      <div class="import-status" id="import-status"></div>
    </div>
  </div>
</div>

<script>
let conversationId = null;
let isStreaming = false;

// ── Markdown renderer (minimal, no deps) ──────────────────────────────────
function renderMarkdown(text) {
  let html = text
    // Escape HTML first
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Code blocks
    .replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // Tables
    .replace(/(\|.+\|\n)+/g, m => renderTable(m))
    // Unordered lists
    .replace(/(^|\n)([ \t]*[-*] .+)+/g, m => '<ul>' + m.replace(/(^|\n)[ \t]*[-*] (.+)/g, '<li>$2</li>') + '</ul>')
    // Paragraphs
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

function renderTable(raw) {
  const lines = raw.trim().split('\n').filter(l => l.trim());
  if (lines.length < 2) return raw;
  const header = lines[0].split('|').map(c => c.trim()).filter(Boolean);
  const rows = lines.slice(2).map(l => l.split('|').map(c => c.trim()).filter(Boolean));
  let t = '<table><thead><tr>' + header.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(r => { t += '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>'; });
  return t + '</tbody></table>';
}

// ── Status polling ────────────────────────────────────────────────────────
async function pollStatus() {
  try {
    const r = await fetch('/api/health');
    if (!r.ok) throw new Error();
    const data = await r.json();
    const c = data.components || {};
    setDot('app',  c.app === 'ok');
    setDot('llm',  c.llm_server === 'ok', c.llm_server);
    setDot('mcp',  c.mcp_server === 'ok', c.mcp_server);
    setDot('pg',   c.postgres === 'ok',   c.postgres);
    // RAG status requires separate call
    fetchRagStatus();
  } catch { setDot('app', false); }
}

async function fetchRagStatus() {
  try {
    const r = await fetch('/api/rag/status');
    if (!r.ok) { setDot('rag', false, 'nicht bereit'); return; }
    const d = await r.json();
    const ok = d.ready === true;
    setDot('rag', ok, ok ? `${d.chunks} Chunks` : 'leer');
  } catch { setDot('rag', false, 'nicht bereit'); }
}

function setDot(key, ok, detail) {
  const dot = document.getElementById('dot-' + key);
  const label = document.getElementById('label-' + key);
  const names = { app: 'App', llm: 'LLM', rag: 'RAG', mcp: 'MCP', pg: 'PostgreSQL' };
  if (!dot || !label) return;
  dot.className = 'dot ' + (ok ? 'ok' : 'err');
  label.textContent = names[key] + (detail ? ': ' + detail : (ok ? ': ok' : ': unavailable'));
}

pollStatus();
setInterval(pollStatus, 15000);

// ── Context bar ───────────────────────────────────────────────────────────
async function updateContextBar() {
  // RAG-Datenbank: alle verfügbaren Dokumente
  try {
    const r = await fetch('/api/rag/documents');
    if (r.ok) {
      const docs = await r.json();
      const container = document.getElementById('ctx-sources');
      if (docs.length === 0) {
        container.innerHTML = '<span class="ctx-no-sources">keine Dokumente</span>';
      } else {
        container.innerHTML = docs.map(d =>
          `<span class="ctx-tag available" title="${d.source_name} · ${d.record_count} Einträge">${d.source_name}</span>`
        ).join('');
      }
    }
  } catch {}

  // Kontext-Auslastung des Gesprächs
  if (conversationId) {
    try {
      const r = await fetch(`/api/chat/${conversationId}/context`);
      if (r.ok) {
        const d = await r.json();
        const pct = d.context_pct;
        const fill = document.getElementById('ctx-fill');
        fill.style.width = pct + '%';
        fill.className = 'ctx-meter-fill' + (pct >= 80 ? ' crit' : pct >= 55 ? ' warn' : '');
        document.getElementById('ctx-turns').textContent =
          `${d.turns} ${d.turns === 1 ? 'Nachricht' : 'Nachrichten'} · ${pct}%`;
        document.getElementById('ctx-pct').textContent = '';
      }
    } catch {}
  }
}

function updateLastUsed(sources, toolCalls) {
  const container = document.getElementById('ctx-used');
  const parts = [];

  // RAG-Quellen die in dieser Antwort abgerufen wurden (dedupliziert nach source_name)
  const usedDocs = [...new Set((sources || []).map(s => s.source_name))];
  usedDocs.forEach(name => {
    parts.push(`<span class="ctx-tag used" title="RAG: ${name}">${name}</span>`);
  });

  // MCP-Tool-Aufrufe
  (toolCalls || []).forEach(t => {
    const label = t.status === 'success' ? `MCP: ${t.name}` : `MCP: ${t.name} (${t.status})`;
    parts.push(`<span class="ctx-tag used-mcp" title="${label}">get_bank_accounts</span>`);
  });

  if (parts.length === 0) {
    container.innerHTML = '<span class="ctx-no-sources">nur Modellwissen</span>';
  } else {
    container.innerHTML = parts.join('');
  }
}

updateContextBar();
setInterval(updateContextBar, 15000);

// ── Chat ──────────────────────────────────────────────────────────────────
function clearConversation() {
  if (conversationId) {
    fetch('/api/chat/' + conversationId, { method: 'DELETE' }).catch(() => {});
    conversationId = null;
  }
  document.getElementById('ctx-turns').textContent = 'neu';
  document.getElementById('ctx-pct').textContent = '';
  document.getElementById('ctx-fill').style.width = '0%';
  document.getElementById('ctx-fill').className = 'ctx-meter-fill';
  document.getElementById('ctx-used').innerHTML = '<span class="ctx-no-sources">—</span>';
  document.getElementById('chat-area').innerHTML = `
    <div class="empty-hint" id="empty-hint">
      <strong>Ella-DemoBank</strong><br>
      Frag mich nach Oracle-Fehlern oder Bankverbindungen.<br><br>
      Beispiele:<br>
      „Was bedeutet ORA-01555?"<br>
      „Welchen IBAN hat Herr Hannes Meier?"
    </div>`;
}

function appendMessage(role, content, extras) {
  const area = document.getElementById('chat-area');
  const hint = document.getElementById('empty-hint');
  if (hint) hint.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.id = extras?.id || '';

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + role;
  avatar.textContent = role === 'user' ? 'Du' : 'E';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (extras?.id) bubble.id = extras.id + '-bubble';

  if (role === 'bot') {
    bubble.innerHTML = content ? renderMarkdown(content) : '';
  } else {
    bubble.textContent = content;
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return { div, bubble };
}

function showTyping() {
  const area = document.getElementById('chat-area');
  const hint = document.getElementById('empty-hint');
  if (hint) hint.remove();

  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  const avatar = document.createElement('div');
  avatar.className = 'avatar bot';
  avatar.textContent = 'E';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(avatar);
  div.appendChild(bubble);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if (!text || isStreaming) return;

  input.value = '';
  input.style.height = 'auto';
  isStreaming = true;
  btn.disabled = true;

  appendMessage('user', text);
  showTyping();

  const msgId = 'bot-' + Date.now();

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_id: conversationId, message: text }),
    });

    if (!res.ok) {
      removeTyping();
      const err = await res.json().catch(() => ({}));
      appendMessage('bot', '**Fehler:** ' + (err.detail || 'Unbekannter Fehler.'));
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let bubble = null;

    const ensureBubble = () => {
      if (!bubble) {
        removeTyping();
        bubble = appendMessage('bot', '', { id: msgId }).bubble;
      }
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = JSON.parse(line.slice(6));
        if (payload.error) {
          ensureBubble();
          bubble.innerHTML = renderMarkdown('**Fehler:** ' + payload.error);
          break;
        }
        if (payload.done) {
          ensureBubble();
          conversationId = payload.conversation_id;
          updateLastUsed(payload.sources, payload.tool_calls);
          updateContextBar();
          // Render sources if any
          if (payload.sources && payload.sources.length > 0) {
            const src = document.createElement('div');
            src.className = 'sources';
            src.innerHTML = '<strong>Quellen:</strong> ' + payload.sources.map(s => `<span>${s.record_key || s.source_name}</span>`).join(', ');
            bubble.appendChild(src);
          }
          // Render tool calls if any
          if (payload.tool_calls && payload.tool_calls.length > 0) {
            const tc = document.createElement('details');
            tc.className = 'tool-trace';
            tc.innerHTML = '<summary>Verwendetes Werkzeug</summary><pre>' +
              payload.tool_calls.map(t => `${t.name}  ${t.duration_ms != null ? t.duration_ms + ' ms' : ''}`).join('\n') + '</pre>';
            bubble.appendChild(tc);
          }
        } else if (payload.delta) {
          ensureBubble();
          fullText += payload.delta;
          bubble.innerHTML = renderMarkdown(fullText);
          document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;
        }
      }
    }
  } catch (e) {
    removeTyping();
    appendMessage('bot', '**Verbindungsfehler:** ' + e.message);
  } finally {
    isStreaming = false;
    btn.disabled = false;
    input.focus();
  }
}

// ── Import (Datei & URL) ──────────────────────────────────────────────────
function switchImportTab(mode) {
  document.getElementById('import-file-row').style.display = mode === 'file' ? 'flex' : 'none';
  document.getElementById('import-url-row').style.display  = mode === 'url'  ? 'flex' : 'none';
  document.getElementById('tab-file').className = 'import-tab' + (mode === 'file' ? ' active' : '');
  document.getElementById('tab-url').className  = 'import-tab' + (mode === 'url'  ? ' active' : '');
  document.getElementById('import-status').textContent = '';
  document.getElementById('import-status').className = 'import-status';
}

function _setImportStatus(text, ok) {
  const s = document.getElementById('import-status');
  s.textContent = text;
  s.className = 'import-status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
}

async function importDocument() {
  const fileInput = document.getElementById('doc-file');
  const btn = document.getElementById('import-btn');

  if (!fileInput.files.length) { _setImportStatus('Bitte eine Datei auswählen.', false); return; }

  const file = fileInput.files[0];
  if (file.size > 5 * 1024 * 1024) { _setImportStatus('Datei zu groß (max. 5 MB).', false); return; }

  const form = new FormData();
  form.append('file', file);

  btn.disabled = true;
  _setImportStatus('Importiere …');

  try {
    const r = await fetch('/api/rag/import', { method: 'POST', body: form });
    const d = await r.json();
    if (r.ok) {
      _setImportStatus(`✓ ${d.imported_records} Einträge importiert (${d.source_name})`, true);
      fileInput.value = '';
      fetchRagStatus();
      updateContextBar();
    } else {
      _setImportStatus('✗ ' + (d.detail || JSON.stringify(d)), false);
    }
  } catch (e) {
    _setImportStatus('✗ ' + e.message, false);
  } finally {
    btn.disabled = false;
  }
}

async function importUrl() {
  const urlInput = document.getElementById('doc-url');
  const btn = document.getElementById('import-url-btn');
  const url = urlInput.value.trim();

  if (!url) { _setImportStatus('Bitte eine URL eingeben.', false); return; }
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    _setImportStatus('URL muss mit http:// oder https:// beginnen.', false); return;
  }

  btn.disabled = true;
  _setImportStatus('Lade Seite …');

  try {
    const r = await fetch('/api/rag/import-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const d = await r.json();
    if (r.ok) {
      _setImportStatus(`✓ ${d.imported_records} Einträge importiert (${d.source_name})`, true);
      urlInput.value = '';
      fetchRagStatus();
      updateContextBar();
    } else {
      _setImportStatus('✗ ' + (d.detail || JSON.stringify(d)), false);
    }
  } catch (e) {
    _setImportStatus('✗ ' + e.message, false);
  } finally {
    btn.disabled = false;
  }
}

// ── Auto-resize textarea ──────────────────────────────────────────────────
const ta = document.getElementById('msg-input');
ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
});
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
